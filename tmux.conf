# plalast tmux config: goes on top of the general ~/.tmux.conf, which tmux
# loads by itself when the server starts. Everything here is scoped to the
# "plalast" session (`set -t plalast`), so other sessions are not touched.
#
# Start the session with everything on top (run it from the repo root; the
# shell expands $PWD, so no path is hard-wired):
#
#   tmux new-session -d -s plalast -c "$PWD" \; \
#        source-file "$PWD/tmux.conf" \; \
#        attach -t plalast
#
# Attach to it again later (it is not rebuilt):
#
#   tmux attach -t plalast
#
# Reload this file after editing it (inside tmux: prefix + : and the same
# command without "tmux"); it is idempotent, windows are not duplicated.
# Again from the repo root:
#
#   tmux source-file "$PWD/tmux.conf"
#
# Kill the session:
#
#   tmux kill-session -t plalast

# ---------------------------------------------------------------------------
# Windows: agent, build, git. Created only once, on a fresh session.
# ---------------------------------------------------------------------------
if -F -t plalast '#{==:#{session_windows},1}' {
  rename-window -t plalast:1 agent
  new-window -d -t plalast:2 -n build -c '#{session_path}'
  new-window -d -t plalast:3 -n git -c '#{session_path}'
  select-window -t plalast:1
}

# ---------------------------------------------------------------------------
# Status bar: green so this session is easy to tell apart, plus git branch.
# ---------------------------------------------------------------------------
set -t plalast status-style "bg=colour22,fg=colour255"
set -t plalast status-left " #[bold]plalast#[none] | "
set -t plalast status-left-length 20
set -t plalast status-right "#(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null) | %H:%M %d-%b "
set -t plalast status-right-length 50
