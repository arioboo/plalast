[package]
name = "plalast"
version = "0.1.0"
edition = "2021"
description = "Build and recall the plalast repo from config.json, its single source of truth"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "plalast-build"
path = "src/bin/build.rs"

[[bin]]
name = "plalast-recall"
path = "src/bin/recall.rs"
