[package]
name = "plalast"
version = "0.1.0"
edition = "2021"
description = "Build and recall the plalast repo from config.json, its single source of truth"
publish = false

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# Verus standard library: specs and proofs inside `verus! { ... }` (see agents/guides/verus.md).
# Pinned to the version of the installed Verus release (`verus --version`).
vstd = "=0.0.0-2026-11-22-0344"

# `cargo verus verify` checks the `verus!` code of this crate.
[package.metadata.verus]
verify = true

# Verus turns on `cfg(verus_only)` while verifying; declare it so cargo does not warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[[bin]]
name = "pla-build"
path = "src/bin/build.rs"

[[bin]]
name = "pla-recall"
path = "src/bin/recall.rs"

[[bin]]
name = "pla-lint"
path = "src/bin/lint.rs"

[[bin]]
name = "pla-audit"
path = "src/bin/audit.rs"
