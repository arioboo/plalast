# params.yaml: only the interruptores (levers) of document sections and modes: enabled,
# on_demand (the default when unset) or disabled. Everything else is in memory.json, the brain.
# Documented in memory.json (primary.schema.keys) and agents/BUILD.md.
levers:
  agents_md:
    premisas-estaticas: enabled
    premisas-dinamicas: enabled
    buenas-practicas: enabled
    preferencias: enabled
  readme_md:
    contributing: enabled
  build_md:
    build-commands: enabled
    brain-files: enabled
    levers: enabled
    entry-types: enabled
    content-blocks: enabled
    adding-module: enabled
    removing-path: enabled
    structure: on_demand
  mode:
    ultra_conservative: on_demand
