# params.yaml: only the user changes it (Params untouchable, Memory updatable).
# Each key is the path of a field of memory.json; see agents/BUILD.md.
primary.docs.agent_placeholder: "note for agent: what follows is generated by the only memory brain, following rules and premises that are intended to be verified and formalized."
config.mem_level: mid
config.branches.integration: develop
config.branches.stable: main
config.audit.allow: []
config.lint.max_lines: {low: 120, mid: 200, hard: 300}
config.hooks.dir: agents/hooks
config.hooks.claude:
  PreToolUse:
    - matcher: "Edit|Write|NotebookEdit"
      hooks:
        - type: command
          command: '"$CLAUDE_PROJECT_DIR"/agents/hooks/protect-generated.sh'
  SessionStart:
    - hooks:
        - type: command
          command: '"$CLAUDE_PROJECT_DIR"/agents/hooks/session-recall.sh'
config.obligatory:
  - primary.agents-md.static_rules
  - primary.agents-md.static_premises
  - primary.agents-md.dynamic_premises
config.preferential:
  - primary.agents-md.good_practices
  - primary.agents-md.preferences
#---INTERRUPTORS---
primary.docs.content.agents_md.sections.reglas-estaticas: enabled
primary.docs.content.agents_md.sections.premisas-estaticas: enabled
primary.docs.content.agents_md.sections.premisas-dinamicas: enabled
primary.docs.content.agents_md.sections.buenas-practicas: {low: on_demand, mid: enabled, hard: enabled}
primary.docs.content.agents_md.sections.preferencias: {low: on_demand, mid: enabled, hard: enabled}
primary.docs.content.readme_md.sections.contributing: enabled
primary.docs.content.build_md.sections.build-commands: enabled
primary.docs.content.build_md.sections.brain-files: enabled
primary.docs.content.build_md.sections.levers: enabled
primary.docs.content.build_md.sections.entry-types: enabled
primary.docs.content.build_md.sections.content-blocks: enabled
primary.docs.content.build_md.sections.adding-module: enabled
primary.docs.content.build_md.sections.removing-path: enabled
primary.docs.content.build_md.sections.structure: on_demand
primary.mode.ultra_conservative: on_demand
primary.docs.content.procedures_md: {low: on_demand, mid: on_demand, hard: enabled}
primary.docs.content.problems_md: {low: on_demand, mid: on_demand, hard: enabled}
primary.docs.content.features_md: on_demand
primary.docs.content.log_md: on_demand
primary.docs.content.index_md: on_demand
